name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node scripts/vendor-mediapipe.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx prettier --check .
      - name: commitlint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"
          else
            npx commitlint --last
          fi

  legacy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cd legacy && python3 -m unittest discover -s tests -q
      - run: cd legacy && node --test tests/lexicon-view.test.mjs

  e2e:
    # macOS runner: has `say` for reference audio and the e2e microphone fixture; the API runs
    # with the fake recognizer so no model download is needed.
    runs-on: macos-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          # The API keeps running in the background during the tests; the cache post-step would
          # otherwise try to prune a venv that is still in use.
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd backend && uv sync --frozen
      - run: cd web && npm ci && node scripts/vendor-mediapipe.mjs && npm run build
      - run: cd web && npx playwright install chromium
      - name: Start the API with the fake recognizer, serving web/out
        run: |
          mkdir -p data
          cd backend
          COACH_RECOGNIZER=fake COACH_WEB_DIST_DIR=../web/out nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8765 > ../data/api-ci.log 2>&1 &
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:8765/api/v1/ready && exit 0; sleep 2; done
          echo "::error title=API did not become ready::see data/api-ci.log"
          cat ../data/api-ci.log
          exit 1
      - run: cd web && E2E_BASE_URL=http://127.0.0.1:8765 npx playwright test
      - name: Stop the API
        if: always()
        run: pkill -f "uvicorn app.main:app" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            data/api-ci.log
